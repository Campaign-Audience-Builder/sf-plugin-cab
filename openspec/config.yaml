schema: spec-driven

context: |
  sf CLI plugin (oclif, TypeScript, @salesforce/sf-plugins-core + @salesforce/core) that admins install
  with `sf plugins install` to move Campaign Audience Builder (CAB) audiences between Salesforce orgs.
  CAB is a managed package with namespace `lb`. The plugin must work against any CAB package version:
  object and field lists are read from describe at runtime, and objects missing in an org are skipped.
  Users are Salesforce admins, not developers. Messages must be plain, actionable, and never show raw
  stack traces by default. Auth always comes from the admin's existing sf CLI org aliases (`-o`).

